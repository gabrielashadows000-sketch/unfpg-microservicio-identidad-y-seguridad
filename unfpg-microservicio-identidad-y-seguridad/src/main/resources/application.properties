#nombre de la aplicacion
spring.application.name=unfpg-microservicio-identidad-y-seguridad
#definir el puerto de la aplicacion
server.port=9093
#url del proyecto
server.servlet.context-path=/unfpg
#cadena de conexion
spring.datasource.url=jdbc:mysql://localhost:3306/universidad_unfpg
#usuario de la bd
spring.datasource.username=root
#clave de la bd
spring.datasource.password=
#driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
